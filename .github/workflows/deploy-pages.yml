# Builds the React site on GitHub's servers and publishes it to GitHub Pages
# every time frontend code is pushed to main.
name: Deploy website

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # same major version as the PC that made package-lock.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages has no server-side routing: serving index.html as the 404 page lets
      # links like /watchnext/movie/tt0468569 open the app, which then shows the right page.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
